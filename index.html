<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.:Template:.</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.css">
    <style>
        /* CSS comments */
        .container {
            --w: 75vw;
            --h: 90vh;
            --block: 10vw;
            --half: calc((var(--w) / 2) - (var(--block) / 2));
            margin: 20px auto;
            width: var(--w);
            text-align: center;
            font-family: sans-serif;
        }

        .block {
            width: var(--block);
            height: var(--block);
            text-align: center;
            line-height: var(--block);
            background-color: #642;
            color: #fff;
            /* animation: anim2 6s linear infinite; */
            visibility: hidden;
            animation: none;
        }

        @keyframes anim2 {

            from,
            to {
                border-radius: 0;
                transform: translateX(0) rotate(0deg);
                background-color: #a00;
            }

            25%,
            75% {
                border-radius: 25%;
                transform: translateX(var(--half)) rotate(180deg);
                background-color: #0a0;
            }

            50% {
                border-radius: 50%;
                transform: translateX(calc(var(--w) - var(--block))) rotate(360deg);
                background-color: #00a;
            }
        }

        .main,
        .footer {
            height: var(--h);
            /* background-color: bisque; */
            background-image: url("https://images.pexels.com/photos/8821401/pexels-photo-8821401.jpeg");
            /* background-image: url("https://images.pexels.com/photos/28532918/pexels-photo-28532918.jpeg"); */
            /* background-image: url("https://images.pexels.com/photos/16747126/pexels-photo-16747126.jpeg"); */
            /* background-size: 100% 100%; */
            background-size: var(--w) var(--h);
            background-repeat: no-repeat;
            background-position: center 20px;
            background-attachment: fixed;
        }

        .main .btn {
            background-color: #a00;
            color: #fff;
            border-radius: 20px;
            margin: 10px;
            border: 1px solid #a00;
            padding: 10px 30px;
            font-weight: bold;
        }

        .main .btn:hover {
            background-color: #fff;
            color: #a00;
            border: 1px solid #000;
            cursor: pointer;
        }

        .section {
            height: 100vh;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
        }

        .section .img {
            width: 31%;
            margin: 1%;
            overflow: hidden;
        }

        .img img {
            width: 100%;
            transition: 1s ease-in-out;
            opacity: 0.9;
        }

        .img img:hover {
            transform: scale(1.5);
            filter: brightness(1.25) contrast(1.25);
            /* filter: brightness(0.8) contrast(1.5) sepia(1.2); */
            opacity: 1;
        }

        .footer {
            /* background-image: url("https://images.pexels.com/photos/821679/pexels-photo-821679.jpeg"); */
            background-image: url("https://images.pexels.com/photos/16747126/pexels-photo-16747126.jpeg");
            /* background-image: url("https://images.pexels.com/photos/28532918/pexels-photo-28532918.jpeg"); */
        }
        .footer .icons, .footer .p{
            position: relative;
            top: 70vh;
            background-color: #aaaa;
            margin: 0;
            padding: 10px 0;
        }
        .icon{
            display: inline-block;
            background-color: #a00;
            color: #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            line-height: 50px;
            text-align: center;
        }
        .icon:hover{
            background-color: #f00;
        }
        @media (max-width: 500px) {
            #block{
                --block: 10vw;
            }
        }
    </style>
</head>

<body>
    <!-- HTML comments -->
    <!-- .container>(main.main>h1{Company Name}+h2{Description text}+button.btn#btn$*2)+(section.section>(.img>img)*6)+footer.footer>.icons>a.icon*4^p.p{Page Footer &copy; AB} -->
    <div class="container">
        <main class="main">
            <div class="block" id="block">Anim</div>
            <h1>Company Name</h1>
            <h2>Description text</h2>
            <button class="btn" id="btn1">Color Mode</button><button class="btn" id="btn2">Animation</button>
        </main>
        <section class="section">
            <div class="img"><img src="https://images.pexels.com/photos/821679/pexels-photo-821679.jpeg"
                    alt="Obraz testowy - most Golden Gate"></div>
            <div class="img"><img src="https://images.pexels.com/photos/821679/pexels-photo-821679.jpeg"
                    alt="Obraz testowy - most Golden Gate"></div>
            <div class="img"><img src="https://images.pexels.com/photos/821679/pexels-photo-821679.jpeg"
                    alt="Obraz testowy - most Golden Gate"></div>
            <div class="img"><img src="https://images.pexels.com/photos/821679/pexels-photo-821679.jpeg"
                    alt="Obraz testowy - most Golden Gate"></div>
            <div class="img"><img src="https://images.pexels.com/photos/821679/pexels-photo-821679.jpeg"
                    alt="Obraz testowy - most Golden Gate"></div>
            <div class="img"><img src="https://images.pexels.com/photos/821679/pexels-photo-821679.jpeg"
                    alt="Obraz testowy - most Golden Gate"></div>
        </section>
        <footer class="footer">
            <div class="icons">
                <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
            </div>
            <p class="p">Page Footer &copy; AB</p>
        </footer>
    </div>

    <script>
        // JS comments
        var counter = [false, false]
        const anim = document.getElementById("block")
        const btn1 = document.getElementById("btn1")
        const btn2 = document.getElementById("btn2")
        
        // Dark mode:
        btn1.onclick = function () {
            console.log("Light mode =", counter[0])
            if (counter[0] == false) {
                document.body.style.backgroundColor = "#000"
                btn1.innerHTML = "Light Mode"
            }
            else {
                document.body.style.backgroundColor = "#fff"
                btn1.innerHTML = "Dark Mode"
            }
            counter[0] = !counter[0]
        }

        // ANIM:
        btn2.addEventListener("click", function () {
            if (counter[1] == false) {
                anim.style.visibility = "visible"
                anim.style.animation = "anim2 6s linear infinite"
                btn2.innerHTML = "Animation off"
            }
            else {
                anim.style.visibility = "hidden"
                anim.style.animation = "none"
                btn2.innerHTML = "Animation on"
            }
            counter[1] = !counter[1]
            console.log("Animation =", counter[1])
        })

        anim.addEventListener("mouseover", () => {
            anim.style.animationPlayState = "paused"
        })
        anim.addEventListener("mouseout", () => {
            anim.style.animationPlayState = "running"
        })
    </script>

</body>

</html>
